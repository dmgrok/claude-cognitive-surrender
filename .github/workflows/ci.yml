name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: CLI starts
        run: node dist/cli.js --help

  hook:
    name: Rust hook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hook
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - run: cargo test --locked
